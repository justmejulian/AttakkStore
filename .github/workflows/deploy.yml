name: 'deploy'

on:
  push:
    branches:
      - main

# One build at a time: three Docker builds in parallel overloaded the host and
# left it unresponsive. The order is api, admin, then the public shop last; a
# failed app does not stop the next one from deploying.
jobs:
  deploy-store:
    needs: deploy-admin
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Cloning repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to dokku
        uses: dokku/github-action@master
        with:
          branch: 'main'
          git_remote_url: 'ssh://dokku@atk-collective.ch:22/attakk-store'
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-api:
    runs-on: ubuntu-24.04
    steps:
      - name: Cloning repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to dokku
        uses: dokku/github-action@master
        with:
          branch: 'main'
          git_remote_url: 'ssh://dokku@atk-collective.ch:22/attakk-store-api'
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-admin:
    needs: deploy-api
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Cloning repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to dokku
        uses: dokku/github-action@master
        with:
          branch: 'main'
          git_remote_url: 'ssh://dokku@atk-collective.ch:22/attakk-store-admin'
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
