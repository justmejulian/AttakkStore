name: 'deploy'

on:
  push:
    branches:
      - main

jobs:
  deploy-store:
    runs-on: ubuntu-24.04
    steps:
      - name: Cloning repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to dokku
        uses: dokku/github-action@master
        with:
          branch: 'main'
          git_remote_url: 'ssh://dokku@atk-collective.ch:22/attakk-store'
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-api:
    runs-on: ubuntu-24.04
    steps:
      - name: Cloning repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to dokku
        uses: dokku/github-action@master
        with:
          branch: 'main'
          git_remote_url: 'ssh://dokku@atk-collective.ch:22/attakk-api'
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-admin:
    runs-on: ubuntu-24.04
    steps:
      - name: Cloning repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to dokku
        uses: dokku/github-action@master
        with:
          branch: 'main'
          git_remote_url: 'ssh://dokku@atk-collective.ch:22/attakk-admin'
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
